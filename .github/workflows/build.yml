name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Create project files
        run: |
          mkdir -p .
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TVHome"
          include ':app'
          EOF_FILE
          mkdir -p .
          cat > build.gradle <<'EOF_FILE'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_FILE
          mkdir -p .
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle <<'EOF_FILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.tvhome.launcher'
              compileSdk 34
              defaultConfig { applicationId 'com.tvhome.launcher'; minSdk 24; targetSdk 33; versionCode 1; versionName '1.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              lint { checkReleaseBuilds false; abortOnError false }
              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false"/>
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="TV Home" android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:banner="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:launchMode="singleTask" android:screenOrientation="landscape"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/tvhome/launcher
          cat > app/src/main/java/com/tvhome/launcher/MainActivity.java <<'EOF_FILE'
          package com.tvhome.launcher;
 
          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.IntentFilter;
          import android.os.SystemClock;
          import android.app.AlertDialog;
          import android.content.SharedPreferences;
          import android.graphics.Outline;
          import android.text.TextUtils;
          import android.view.ViewOutlineProvider;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.BitmapDrawable;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import java.io.File;
          import java.util.*;
 
          public class MainActivity extends Activity {
              static final String HAPP = "com.happproxy"; // пакет Happ
              ImageView bgA, bgB;
              boolean front;
              int idx;
              TextView wx;
              LinearLayout row;
              SharedPreferences sp;
              TextClock clock, dateView;
              boolean dirty = true, busy, vis;
              long lastBg, lastWx;
              BroadcastReceiver pkgRx = new BroadcastReceiver() { public void onReceive(Context c, Intent i) { dirty = true; } };
              long wxDelay = 900000;
              Handler h = new Handler(Looper.getMainLooper());
              Runnable tick = new Runnable() { public void run() { nextBg(); h.postDelayed(this, sp.getInt("bgmin", 10) * 60000L); } };
 
              Runnable wxTick = new Runnable() { public void run() { loadWeather(); } };
 
              // Погода: Open-Meteo (без ключа), Екатеринбург
 
 
              void loadWeather() {
                  lastWx = SystemClock.elapsedRealtime();
                  String city = sp.getString("city", "Екатеринбург");
                  float lat = sp.getFloat("lat", 56.84f), lon = sp.getFloat("lon", 60.61f);
                  boolean pct = sp.getBoolean("pct", true);
                  long every = sp.getInt("wxint", 15) * 60000L;
                  Thread th = new Thread(() -> {
                      String res = null, err = "";
                      try {
                          org.json.JSONObject cur = new org.json.JSONObject(new String(get(
                              "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon
                              + "&current=temperature_2m,cloud_cover&timezone=auto"), "UTF-8")).getJSONObject("current");
                          long t = Math.round(cur.getDouble("temperature_2m"));
                          int cc = cur.getInt("cloud_cover");
                          res = city + "  " + (t > 0 ? "+" : "") + t + "°C  " + cloudText(cc) + (pct ? " " + cc + "%" : "");
                      } catch (Exception e) { err = e.getClass().getSimpleName(); }
                      if (res == null) {
                          try {
                              String[] q = new String(get("https://wttr.in/" + lat + "," + lon + "?m&format=%25t%7C%25C&lang=ru"), "UTF-8").trim().split("\\|");
                              res = city + "  " + q[0].trim() + "  " + q[1].trim().toLowerCase();
                          } catch (Exception e) { err = err + "/" + e.getClass().getSimpleName(); }
                      }
                      if (res != null) sp.edit().putString("wx", res).apply();
                      wxDelay = res != null ? every : 60000;
                      final String out = res != null ? res : city + "  нет связи (" + err + ")";
                      runOnUiThread(() -> {
                          wx.setText(out);
                          if (vis) { h.removeCallbacks(wxTick); h.postDelayed(wxTick, wxDelay); }
                      });
                  });
                  th.setPriority(Thread.MIN_PRIORITY);
                  th.start();
              }
 
              String cloudText(int c) {
                  if (c < 11) return "ясно";
                  if (c < 31) return "малооблачно";
                  if (c < 71) return "переменная облачность";
                  if (c < 91) return "облачно";
                  return "пасмурно";
              }
 
              void refreshWeather() { lastWx = 0; h.removeCallbacks(wxTick); h.post(wxTick); }
 
              void applyStyle() {
                  int cs = sp.getInt("clock", 112);
                  clock.setTextSize(cs);
                  dateView.setTextSize(Math.max(14f, cs / 4.5f));
                  wx.setTextSize(sp.getInt("wxsize", 26));
              }
 
              void weatherMenu() {
                  String[] items = {"Город: " + sp.getString("city", "Екатеринбург"), "Обновление: каждые " + sp.getInt("wxint", 15) + " мин",
                      "Облачность в %: " + (sp.getBoolean("pct", true) ? "да" : "нет"), "Размер текста: " + sp.getInt("wxsize", 26), "Обновить сейчас"};
                  new AlertDialog.Builder(this).setTitle("Настройки погоды").setItems(items, (dlg, w) -> {
                      if (w == 0) cityMenu();
                      else if (w == 1) stepper("Обновление, минут", "wxint", 5, 60, 5, 15, () -> { refreshWeather(); weatherMenu(); });
                      else if (w == 2) { sp.edit().putBoolean("pct", !sp.getBoolean("pct", true)).apply(); refreshWeather(); weatherMenu(); }
                      else if (w == 3) stepper("Размер текста погоды", "wxsize", 14, 48, 2, 26, this::weatherMenu);
                      else refreshWeather();
                  }).setNegativeButton("Назад", (dlg, w) -> settings()).show();
              }
 
              static final String[] CITIES = {"Екатеринбург", "Москва", "Санкт-Петербург", "Новосибирск", "Казань", "Челябинск",
                  "Пермь", "Тюмень", "Самара", "Краснодар", "Другой город..."};
              static final float[][] COORDS = {{56.84f, 60.61f}, {55.75f, 37.62f}, {59.94f, 30.31f}, {55.03f, 82.92f}, {55.79f, 49.12f},
                  {55.16f, 61.40f}, {58.01f, 56.23f}, {57.15f, 65.53f}, {53.20f, 50.15f}, {45.04f, 38.98f}};
 
              void cityMenu() {
                  new AlertDialog.Builder(this).setTitle("Город").setItems(CITIES, (dlg, w) -> {
                      if (w < COORDS.length) setCity(CITIES[w], COORDS[w][0], COORDS[w][1]);
                      else typeCity();
                  }).setNegativeButton("Назад", (dlg, w) -> weatherMenu()).show();
              }
 
              void setCity(String name, float lat, float lon) {
                  sp.edit().putString("city", name).putFloat("lat", lat).putFloat("lon", lon).remove("wx").apply();
                  wx.setText(name + "  ...");
                  refreshWeather();
                  weatherMenu();
              }
 
              void typeCity() {
                  EditText et = new EditText(this);
                  et.setSingleLine(true); et.setHint("Название города");
                  new AlertDialog.Builder(this).setTitle("Введите город").setView(et)
                      .setPositiveButton("Найти", (dlg, w) -> new Thread(() -> {
                          try {
                              org.json.JSONObject o = new org.json.JSONObject(new String(get(
                                  "https://geocoding-api.open-meteo.com/v1/search?count=1&language=ru&name="
                                  + java.net.URLEncoder.encode(et.getText().toString().trim(), "UTF-8")), "UTF-8"))
                                  .getJSONArray("results").getJSONObject(0);
                              String nm = o.getString("name");
                              float la = (float) o.getDouble("latitude"), lo = (float) o.getDouble("longitude");
                              runOnUiThread(() -> setCity(nm, la, lo));
                          } catch (Exception e) {
                              runOnUiThread(() -> Toast.makeText(this, "Город не найден", Toast.LENGTH_LONG).show());
                          }
                      }).start())
                      .setNegativeButton("Назад", (dlg, w) -> cityMenu()).show();
              }
 
 
 
              int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }
 
              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences("cfg", MODE_PRIVATE);
                  IntentFilter pf = new IntentFilter();
                  pf.addAction(Intent.ACTION_PACKAGE_ADDED); pf.addAction(Intent.ACTION_PACKAGE_REMOVED); pf.addAction(Intent.ACTION_PACKAGE_REPLACED);
                  pf.addDataScheme("package");
                  registerReceiver(pkgRx, pf);
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);
                  bgA = new ImageView(this); bgB = new ImageView(this);
                  bgA.setImageDrawable(gradient()); bgB.setAlpha(0f);
                  for (ImageView v : new ImageView[]{bgA, bgB}) { v.setScaleType(ImageView.ScaleType.CENTER_CROP); v.setColorFilter(0x40000000); root.addView(v, -1, -1); }
 
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setPadding(dp(64), dp(40), dp(64), dp(24));
                  root.addView(col, -1, -1);
 
                  FrameLayout head = new FrameLayout(this);
                  col.addView(head, -1, -2);
                  LinearLayout clk = new LinearLayout(this);
                  clk.setOrientation(LinearLayout.VERTICAL);
                  head.addView(clk, -2, -2);
                  TextClock t = new TextClock(this);
                  t.setFormat12Hour("HH:mm"); t.setFormat24Hour("HH:mm");
                  t.setTextSize(112); t.setTextColor(Color.WHITE);
                  t.setTypeface(Typeface.create("sans-serif-light", Typeface.NORMAL));
                  clk.addView(t);
                  clock = t;
                  TextClock d = new TextClock(this);
                  d.setFormat12Hour("EEEE, d MMMM"); d.setFormat24Hour("EEEE, d MMMM");
                  d.setTextSize(24); d.setTextColor(0xCCFFFFFF);
                  clk.addView(d);
                  dateView = d;
                  wx = new TextView(this);
                  wx.setText(sp.getString("wx", "Екатеринбург")); wx.setTextSize(26); wx.setTextColor(Color.WHITE);
                  wx.setPadding(0, dp(12), 0, 0);
                  clk.addView(wx);
 
                  LinearLayout pills = new LinearLayout(this);
                  pills.setPadding(0, dp(16), 0, 0);
                  FrameLayout.LayoutParams plp = new FrameLayout.LayoutParams(-2, -2, Gravity.END | Gravity.TOP);
                  plp.rightMargin = dp(64);
                  head.addView(pills, plp);
                  pills.addView(pill("VPN Happ", v -> {
                      Intent i = getPackageManager().getLaunchIntentForPackage(HAPP);
                      if (i != null) startActivity(i);
                      else Toast.makeText(this, "Happ не установлен", Toast.LENGTH_LONG).show();
                  }));
                  pills.addView(pill("Настройки", v -> settings()));
 
                  TextView lab = new TextView(this);
                  lab.setText("ПРИЛОЖЕНИЯ"); lab.setTextSize(14); lab.setLetterSpacing(0.15f); lab.setTextColor(0xAAFFFFFF);
                  lab.setPadding(0, dp(40), 0, dp(8));
                  col.addView(lab);
                  HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false); hs.setClipToPadding(false); hs.setClipChildren(false);
                  hs.setPadding(0, dp(16), 0, dp(16));
                  row = new LinearLayout(this);
                  hs.addView(row);
                  col.addView(hs, -1, -2);
                  applyStyle();
                  setContentView(root);
              }
 
              @Override protected void onResume() {
                  super.onResume();
                  vis = true;
                  if (dirty) { loadApps(); focusFirst(); dirty = false; }
                  long now = SystemClock.elapsedRealtime();
                  h.removeCallbacks(tick);
                  h.postDelayed(tick, lastBg == 0 ? 0 : Math.max(0, lastBg + sp.getInt("bgmin", 10) * 60000L - now));
                  h.removeCallbacks(wxTick);
                  h.postDelayed(wxTick, lastWx == 0 ? 0 : Math.max(0, lastWx + wxDelay - now));
              }
 
              @Override protected void onPause() { super.onPause(); vis = false; h.removeCallbacks(tick); h.removeCallbacks(wxTick); }
 
              @Override protected void onDestroy() { super.onDestroy(); unregisterReceiver(pkgRx); }
 
              @Override public void onBackPressed() { }
 
              void focusStyle(View v, int base, int rad) {
                  GradientDrawable g = new GradientDrawable();
                  g.setCornerRadius(rad); g.setColor(base);
                  v.setBackground(g);
                  v.setOnFocusChangeListener((x, f) -> {
                      g.setColor(f ? 0xFF3B82F6 : base);
                      x.animate().scaleX(f ? 1.1f : 1f).scaleY(f ? 1.1f : 1f).setDuration(150);
                  });
              }
 
              TextView pill(String s, View.OnClickListener c) {
                  TextView t = new TextView(this);
                  t.setText(s); t.setTextSize(15); t.setTextColor(Color.WHITE);
                  t.setPadding(dp(18), dp(8), dp(18), dp(8));
                  t.setFocusable(true); t.setOnClickListener(c);
                  focusStyle(t, 0x44FFFFFF, dp(14));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-2, -2);
                  lp.leftMargin = dp(10); t.setLayoutParams(lp);
                  return t;
              }
 
              View tile(ResolveInfo r) {
                  PackageManager pm = getPackageManager();
                  float sc = size() / 100f;
                  int rad = dp(radius());
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL); c.setGravity(Gravity.CENTER_HORIZONTAL);
                  c.setPadding(dp(10), dp(10), dp(10), dp(10));
                  Drawable d = r.activityInfo.loadBanner(pm);
                  boolean banner = d != null;
                  if (!banner) d = r.loadIcon(pm);
                  ImageView iv = new ImageView(this);
                  iv.setImageDrawable(d);
                  iv.setScaleType(banner ? ImageView.ScaleType.CENTER_CROP : ImageView.ScaleType.FIT_CENTER);
                  if (!banner) iv.setBackgroundColor(0x33FFFFFF);
                  iv.setClipToOutline(true);
                  iv.setOutlineProvider(new ViewOutlineProvider() {
                      @Override public void getOutline(View vw, Outline o) { o.setRoundRect(0, 0, vw.getWidth(), vw.getHeight(), rad); }
                  });
                  boolean sq = sp.getBoolean("square", false);
                  int w = (int) (dp(sq ? 140 : 224) * sc);
                  c.addView(iv, w, (int) (dp(sq ? 140 : 126) * sc));
                  String label = r.loadLabel(pm).toString();
                  TextView tv = new TextView(this);
                  tv.setText(label); tv.setTextColor(Color.WHITE); tv.setTextSize(Math.max(11f, 16f * sc));
                  tv.setSingleLine(true); tv.setEllipsize(TextUtils.TruncateAt.END); tv.setGravity(Gravity.CENTER_HORIZONTAL);
                  tv.setPadding(0, dp(8), 0, 0);
                  c.addView(tv, w, -2);
                  c.setFocusable(true);
                  focusStyle(c, 0x22FFFFFF, rad + dp(8));
                  ComponentName cn = new ComponentName(r.activityInfo.packageName, r.activityInfo.name);
                  String pkg = r.activityInfo.packageName;
                  c.setOnClickListener(v -> {
                      try { startActivity(new Intent(Intent.ACTION_MAIN).setComponent(cn).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)); }
                      catch (Exception e) { Toast.makeText(this, "Не удалось открыть", Toast.LENGTH_SHORT).show(); }
                  });
                  c.setOnLongClickListener(v -> {
                      new AlertDialog.Builder(this).setTitle("Убрать «" + label + "» с экрана?")
                          .setPositiveButton("Убрать", (dd, ww) -> {
                              Set<String> hs = hidden(); hs.add(pkg);
                              sp.edit().putStringSet("hidden", hs).apply();
                              loadApps(); focusFirst();
                          })
                          .setNegativeButton("Отмена", null).show();
                      return true;
                  });
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-2, -2);
                  lp.rightMargin = dp(16); c.setLayoutParams(lp);
                  return c;
              }
 
              int size() { return sp.getInt("size", 100); }
              int radius() { return sp.getInt("radius", 18); }
              Set<String> hidden() { return new HashSet<String>(sp.getStringSet("hidden", new HashSet<String>())); }
              void focusFirst() { if (row.getChildCount() > 0) row.getChildAt(0).requestFocus(); }
 
              List<ResolveInfo> allApps() {
                  PackageManager pm = getPackageManager();
                  Map<String, ResolveInfo> m = new LinkedHashMap<>();
                  for (String cat : new String[]{Intent.CATEGORY_LEANBACK_LAUNCHER, Intent.CATEGORY_LAUNCHER})
                      for (ResolveInfo r : pm.queryIntentActivities(new Intent(Intent.ACTION_MAIN).addCategory(cat), 0)) {
                          String p = r.activityInfo.packageName;
                          if (!p.equals(getPackageName()) && !m.containsKey(p)) m.put(p, r);
                      }
                  Map<String, String> lbl = new HashMap<>();
                  for (ResolveInfo r : m.values()) lbl.put(r.activityInfo.packageName, r.loadLabel(pm).toString().toLowerCase());
                  List<ResolveInfo> l = new ArrayList<>(m.values());
                  Collections.sort(l, (a, c) -> lbl.get(a.activityInfo.packageName).compareTo(lbl.get(c.activityInfo.packageName)));
                  return l;
              }
 
              void loadApps() {
                  row.removeAllViews();
                  Set<String> hid = hidden();
                  for (ResolveInfo r : allApps())
                      if (!hid.contains(r.activityInfo.packageName)) row.addView(tile(r));
                  row.addView(pill("+ Добавить", v -> pickApps()));
              }
 
              void settings() {
                  String[] items = {"Приложения на экране", "Значки: размер " + size() + "%", "Значки: скругление " + radius(),
                      "Значки: форма - " + (sp.getBoolean("square", false) ? "квадрат" : "16:9"), "Часы: размер " + sp.getInt("clock", 112),
                      "Фон из сети: " + (sp.getBoolean("bgon", true) ? "вкл" : "выкл"), "Смена фона: раз в " + sp.getInt("bgmin", 10) + " мин",
                      "Погода...", "Системные настройки Android"};
                  new AlertDialog.Builder(this).setTitle("Настройки лаунчера").setItems(items, (dlg, w) -> {
                      if (w == 0) pickApps();
                      else if (w == 1) stepper("Размер значков, %", "size", 50, 200, 10, 100, this::settings);
                      else if (w == 2) stepper("Скругление значков", "radius", 0, 40, 2, 18, this::settings);
                      else if (w == 3) { sp.edit().putBoolean("square", !sp.getBoolean("square", false)).apply(); loadApps(); settings(); }
                      else if (w == 4) stepper("Размер часов", "clock", 48, 160, 8, 112, this::settings);
                      else if (w == 5) { sp.edit().putBoolean("bgon", !sp.getBoolean("bgon", true)).apply(); nextBg(); settings(); }
                      else if (w == 6) stepper("Смена фона, минут", "bgmin", 5, 60, 5, 10, this::settings);
                      else if (w == 7) weatherMenu();
                      else startActivity(new Intent(Settings.ACTION_SETTINGS));
                  }).setNegativeButton("Закрыть", null).show();
              }
 
              void pickApps() {
                  PackageManager pm = getPackageManager();
                  List<ResolveInfo> all = allApps();
                  Set<String> hid = hidden();
                  String[] names = new String[all.size()];
                  boolean[] on = new boolean[all.size()];
                  for (int i = 0; i < names.length; i++) {
                      names[i] = all.get(i).loadLabel(pm).toString();
                      on[i] = !hid.contains(all.get(i).activityInfo.packageName);
                  }
                  new AlertDialog.Builder(this).setTitle("Какие приложения показывать")
                      .setMultiChoiceItems(names, on, (dlg, which, checked) -> {
                          String p = all.get(which).activityInfo.packageName;
                          if (checked) hid.remove(p); else hid.add(p);
                      })
                      .setPositiveButton("Готово", (dlg, w) -> { sp.edit().putStringSet("hidden", hid).apply(); loadApps(); focusFirst(); })
                      .setNegativeButton("Отмена", null).show();
              }
 
              void stepper(String title, String key, int min, int max, int step, int def, Runnable back) {
                  AlertDialog dlg = new AlertDialog.Builder(this).setTitle(title + ": " + sp.getInt(key, def))
                      .setNegativeButton("-", null).setNeutralButton("+", null).setPositiveButton("Готово", null).create();
                  dlg.show();
                  Button minus = dlg.getButton(AlertDialog.BUTTON_NEGATIVE);
                  Button plus = dlg.getButton(AlertDialog.BUTTON_NEUTRAL);
                  minus.setOnClickListener(v -> change(dlg, title, key, min, max, def, -step));
                  plus.setOnClickListener(v -> change(dlg, title, key, min, max, def, step));
                  dlg.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v -> dlg.dismiss());
                  dlg.setOnDismissListener(x -> back.run());
              }
 
              void change(AlertDialog dlg, String title, String key, int min, int max, int def, int delta) {
                  int val = Math.max(min, Math.min(max, sp.getInt(key, def) + delta));
                  sp.edit().putInt(key, val).apply();
                  dlg.setTitle(title + ": " + val);
                  loadApps();
                  applyStyle();
              }
 
              // Фоны из сети: Bing (картинки дня), запасной источник picsum.photos; офлайн: кэш, затем градиент
              List<String> urls = new ArrayList<>();
              int net;
 
              Drawable gradient() {
                  int[][] c = {{0xFF0F2027, 0xFF2C5364}, {0xFF42275A, 0xFF734B6D}, {0xFF1D2B64, 0xFFF8CDDA}, {0xFF141E30, 0xFF243B55}, {0xFF3A1C71, 0xFFD76D77}};
                  return new GradientDrawable(GradientDrawable.Orientation.TL_BR, c[idx++ % c.length]);
              }
 
              byte[] get(String u) throws Exception {
                  java.net.HttpURLConnection c = (java.net.HttpURLConnection) new java.net.URL(u).openConnection();
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Android TV)"); c.setConnectTimeout(10000); c.setReadTimeout(15000); c.setInstanceFollowRedirects(true);
                  java.io.InputStream in = c.getInputStream();
                  java.io.ByteArrayOutputStream o = new java.io.ByteArrayOutputStream();
                  byte[] b = new byte[16384]; int n;
                  while ((n = in.read(b)) > 0) o.write(b, 0, n);
                  in.close(); c.disconnect();
                  return o.toByteArray();
              }
 
              Drawable decode(File f) {
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  BitmapFactory.decodeFile(f.getPath(), o);
                  int sw = getResources().getDisplayMetrics().widthPixels, sm = 1;
                  while (o.outWidth / (sm * 2) >= sw) sm *= 2;
                  o.inJustDecodeBounds = false; o.inSampleSize = sm; o.inPreferredConfig = Bitmap.Config.RGB_565;
                  Bitmap bm = BitmapFactory.decodeFile(f.getPath(), o);
                  return bm == null ? null : new BitmapDrawable(getResources(), bm);
              }
 
              void nextBg() {
                  if (!sp.getBoolean("bgon", true) || busy) return;
                  busy = true;
                  lastBg = SystemClock.elapsedRealtime();
                  Thread th = new Thread(() -> {
                      Drawable d = null;
                      try {
                          int k = net++ % 8;
                          File f = new File(getCacheDir(), "bg" + k + ".jpg");
                          if (f.exists() && System.currentTimeMillis() - f.lastModified() > 3 * 86400000L) f.delete();
                          if (!f.exists()) {
                              if (urls.isEmpty()) {
                                  try {
                                      org.json.JSONArray a = new org.json.JSONObject(new String(
                                          get("https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=8&mkt=en-US"), "UTF-8")).getJSONArray("images");
                                      for (int i = 0; i < a.length(); i++)
                                          urls.add("https://www.bing.com" + a.getJSONObject(i).getString("urlbase") + "_1920x1080.jpg");
                                  } catch (Exception e) { }
                                  if (urls.isEmpty()) for (int i = 1; i <= 8; i++) urls.add("https://picsum.photos/1920/1080?random=" + i);
                              }
                              byte[] data = get(urls.get(k % urls.size()));
                              java.io.FileOutputStream o = new java.io.FileOutputStream(f);
                              o.write(data); o.close();
                          }
                          d = decode(f);
                          if (d == null) f.delete();
                      } catch (Throwable e) { }
                      if (d == null) {
                          try {
                              File[] fs = getCacheDir().listFiles((x, n) -> n.startsWith("bg"));
                              if (fs != null && fs.length > 0) d = decode(fs[net % fs.length]);
                          } catch (Throwable e) { }
                      }
                      final Drawable dd = d != null ? d : gradient();
                      runOnUiThread(() -> {
                          ImageView in = front ? bgA : bgB, out = front ? bgB : bgA;
                          front = !front;
                          in.setImageDrawable(dd);
                          in.animate().alpha(1f).setDuration(1000);
                          out.animate().alpha(0f).setDuration(1000).withEndAction(() -> out.setImageDrawable(null));
                          busy = false;
                      });
                  });
                  th.setPriority(Thread.MIN_PRIORITY);
                  th.start();
              }
          }
          EOF_FILE
      - name: Build APK
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|What went wrong|FAILURE:|Could not|SDK" -A4 build.log | head -40)
            [ -z "$msg" ] && msg=$(tail -30 build.log)
            msg=$(printf '%s' "$msg" | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-log, path: build.log }
      - uses: actions/upload-artifact@v4
        with: { name: TVHome-apk, path: app/build/outputs/apk/release/app-release.apk }
